# Plan de ZAP (Automation Framework) para el pentest de caja negra contra la tienda.
# Las variables ZAP_TARGET, ZAP_REPORTES y FECHA las define scripts/escanear-zap.sh antes de lanzar ZAP.
env:
  contexts:
    - name: tienda
      urls:
        - ${ZAP_TARGET}/
        - ${ZAP_TARGET}/wp-json/
        - ${ZAP_TARGET}/consultar-pedido/
        - ${ZAP_TARGET}/xmlrpc.php
      includePaths:
        - ${ZAP_TARGET}.*
  parameters:
    failOnError: false
    progressToStdout: true

jobs:
  - type: spider
    parameters:
      context: tienda
      maxDuration: 5

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: tienda
      maxScanDurationInMins: 20
      maxRuleDurationInMins: 2

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: report
    parameters:
      template: modern
      reportDir: ${ZAP_REPORTES}
      reportFile: ${FECHA}_zap_caja-negra
      reportTitle: Pentest de caja negra - Tienda UMG (localhost)

  - type: report
    parameters:
      template: traditional-json
      reportDir: ${ZAP_REPORTES}
      reportFile: ${FECHA}_zap_caja-negra
