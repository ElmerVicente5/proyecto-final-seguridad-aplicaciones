# Version endurecida tras la auditoria de la fase 4 (Trivy y KICS).
# La version anterior sin hardening se conserva en docker-compose.yml.antes para el antes/despues.
# Antes de levantar hay que generar los secretos: ./scripts/generar-secretos.sh (lo hace instalar.sh).

name: umg-wp-ecommerce

services:
  db:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    container_name: umg-db
    restart: unless-stopped
    # Las contraseñas se leen de archivos de secreto, no de variables de entorno.
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wpuser}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    # MySQL ya no se publica en el anfitrión; solo es accesible en la red interna backend.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$(cat /run/secrets/mysql_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp
      - /run/mysqld

  wordpress:
    image: wordpress:7.1.4-php8.3-apache@sha256:074f9ef5429025dab76a4242f5b796f64ae76a49dd19b6708ad29e1893a8d383
    container_name: umg-wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &wp_env
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wpuser}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/mysql_password
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      # Depuración apagada para no divulgar errores de PHP.
      WORDPRESS_DEBUG: "0"
      # La clave JWT de la versión segura del plugin se lee del secreto montado.
      CONSULTA_PEDIDOS_JWT_SECRET_FILE: /run/secrets/consulta_pedidos_jwt_secret
    secrets:
      - mysql_password
      - consulta_pedidos_jwt_secret
    # WordPress ya no se publica en el anfitrion; el trafico entra siempre por el WAF.
    expose:
      - "80"
    volumes:
      - wp_html:/var/www/html
      - ./plugin-consulta-pedidos/${PLUGIN_VERSION:-vulnerable}:/var/www/html/wp-content/plugins/consulta-pedidos:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 300
    # Apache necesita escribir en estas rutas; el resto del sistema de archivos es de solo lectura.
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run/apache2

  wpcli:
    image: wordpress:cli-2.12.0-php8.3@sha256:e4980e3ef763ce7535049c05a54e906d95b16370f28ca02fa329a079eebf3f65
    profiles: ["herramientas"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      <<: *wp_env
      WORDPRESS_DEBUG: ""
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_TITULO: ${WP_TITULO:-Tienda UMG}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@tienda-umg.test}
      WOOCOMMERCE_VERSION: ${WOOCOMMERCE_VERSION:-11.3.0}
      CREAR_DATOS_EJEMPLO: ${CREAR_DATOS_EJEMPLO:-1}
    secrets:
      - mysql_password
      - consulta_pedidos_jwt_secret
      - wp_admin_password
      - gestor_password
      - editor_password
      - cliente_password
    volumes:
      - wp_html:/var/www/html
      - ./plugin-consulta-pedidos/${PLUGIN_VERSION:-vulnerable}:/var/www/html/wp-content/plugins/consulta-pedidos:ro
      - ./scripts:/scripts:ro
    working_dir: /var/www/html
    # frontend para descargar WooCommerce de internet, backend para configurar la base de datos.
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  composer:
    image: composer:2.11.2
    profiles: ["herramientas"]
    volumes:
      - ./plugin-consulta-pedidos:/app
    working_dir: /app
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  waf:
    image: owasp/modsecurity-crs:4.30.0-apache-202611160811
    container_name: umg-waf
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      # Proxy inverso que reenvia al contenedor de WordPress.
      BACKEND: http://wordpress:80
      SERVERNAME: localhost
      PORT: 8080
      # En local se accede por HTTP; reenvia el esquema real para que WordPress genere enlaces http y no https.
      REQ_HEADER_FORWARDED_PROTO: "http"
      # On bloquea; DetectionOnly solo registra. Nivel de paranoia 1 para no romper el panel.
      MODSEC_RULE_ENGINE: "On"
      PARANOIA: "1"
      ANOMALY_INBOUND: "10"
      ANOMALY_OUTBOUND: "5"
      # Deja pasar cuerpos grandes de subida de medios en el panel.
      MODSEC_REQ_BODY_LIMIT: "13107200"
    volumes:
      - ./waf/rules/999-umg-custom.conf:/etc/modsecurity.d/owasp-crs/rules/999-umg-custom.conf:ro
      - waf_logs:/var/log/apache2
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  mysql_password:
    file: ./secrets/mysql_password.txt
  wp_admin_password:
    file: ./secrets/wp_admin_password.txt
  gestor_password:
    file: ./secrets/gestor_password.txt
  editor_password:
    file: ./secrets/editor_password.txt
  cliente_password:
    file: ./secrets/cliente_password.txt
  consulta_pedidos_jwt_secret:
    file: ./secrets/consulta_pedidos_jwt_secret.txt

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
  wp_html:
  waf_logs:
