# Reglas propias que complementan el OWASP Core Rule Set para la tienda UMG.
# Se cargan despues del CRS, asi que pueden bloquear lo que el CRS deja pasar.

# Bloquea xmlrpc.php, que en la fase 3 permitio fuerza bruta amplificada con system.multicall.
SecRule REQUEST_URI "@endsWith /xmlrpc.php" \
    "id:10001,phase:1,deny,status:403,log,msg:'UMG: acceso a xmlrpc.php bloqueado'"

# Frena la enumeracion de usuarios por ?author=N, que revelaba el usuario administrador.
SecRule ARGS_GET:author "@rx ^[0-9]+$" \
    "id:10002,phase:1,deny,status:403,log,msg:'UMG: enumeracion de usuarios por author bloqueada'"

# Oculta las cabeceras que revelan la version del servidor y de PHP del backend.
Header always unset X-Powered-By
Header always unset Server
Header always set Server "UMG-WAF"
